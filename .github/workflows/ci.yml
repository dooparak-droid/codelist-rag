name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Build test retrieval index from synthetic fixture
        run: |
          codelist-rag build-index \
            --terminology-json tests/fixtures/synthetic_terminology.json \
            --chroma-path ./data/chroma_db \
            --bm25-path ./data/bm25_index.pkl

      - name: Run unit and integration tests
        run: |
          pytest --cov=codelist_rag tests/

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t codelist-rag .

      - name: Build the synthetic fixture index inside the container
        run: |
          mkdir -p data
          docker run --rm -v "$PWD/data:/app/data" codelist-rag \
            codelist-rag build-index \
            --terminology-json /app/tests/fixtures/synthetic_terminology.json \
            --chroma-path /app/data/chroma_db \
            --bm25-path /app/data/bm25_index.pkl

      - name: Start the service and check /health
        run: |
          docker run -d --name svc -p 8000:8000 -p 8501:8501 -v "$PWD/data:/app/data" codelist-rag
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > health.json && break
            sleep 2
          done
          cat health.json
          python3 -c "import json; d=json.load(open('health.json')); assert d['status']=='healthy' and d['retriever_loaded'] and d['terminology_concepts']==10, d"

      - name: Check the Streamlit page is up
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health > ui.txt && break
            sleep 2
          done
          test "$(cat ui.txt)" = "ok"

      - name: Show container logs on failure
        if: failure()
        run: docker logs svc
