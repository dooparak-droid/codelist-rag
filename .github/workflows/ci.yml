name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Build test retrieval index from synthetic fixture
        run: |
          codelist-rag build-index \
            --terminology-json tests/fixtures/synthetic_terminology.json \
            --chroma-path ./data/chroma_db \
            --bm25-path ./data/bm25_index.pkl

      - name: Run unit and integration tests
        run: |
          pytest --cov=codelist_rag tests/
